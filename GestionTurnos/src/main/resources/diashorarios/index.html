<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <br/>

    <form class="form-horizontal" th:action="@{/diashorarios/save}" th:object="${diashorarios}" method="post">

        <!-- Seleccion de Día -->
        <div class="form-group row">
            <label class="col-sm-2 col-form-label font-weight-bold">Día:</label>
            <div class="col-sm-6">
                <select class="form-control" name="diaId" required>
                    <option value="">-- Seleccionar Día --</option>
                    <option th:each="d : ${diashorarios.dias}"
                            th:value="${d.id}"
                            th:text="${d.descrip}">
                    </option>
                </select>
            </div>
        </div>

        <br/>

        <div class="form-group row">
            <label class="col-sm-2 col-form-label font-weight-bold">Horarios:</label>
            <div class="col-sm-6">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="thead-light">
                        <tr>
                            <th width="10%" class="text-center">Seleccionar</th>
                            <th>Hora</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="horario, stat : *{horarios}">
                            <input type="hidden" th:field="*{horarios[__${stat.index}__].id}" />

                            <td class="text-center">
                                <input type="checkbox" th:field="*{horarios[__${stat.index}__].sel}" />
                            </td>

                            <td th:text="${horario.descrip}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>


        <div class="form-group row">
            <div class="col-sm-6 offset-sm-2">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a class="btn btn-default" th:href="@{/turnosgenerales}">Cancelar</a>
            </div>
        </div>


        <h5 style="color:red;" th:text="${message}"></h5>

    </form>

</div>

</body>
</html>
