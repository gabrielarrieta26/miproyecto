    <body>

        <div class="container">

            <th:block th:insert="~{header :: header}"></th:block>

            <section class="home-hero">
                <span class="home-eyebrow">Clínica</span>
                <h1 class="home-brand">Gestión de Turnos</h1>
                <p class="home-lead">
                    Agenda clara para pacientes, profesionales y disponibilidad. Diseñada para el ritmo diario de la clínica.

            </section>

            <div class="home-actions">

                    <h3>Pacientes</h3>
                    <p>Fichas y búsqueda</p>
                </a>
                <a class="home-action" th:href="@{/profesionales}">

                    <p>Equipo médico</p>
                </a>
                <a class="home-action" th:href="@{/turnosprofesionales}">

                </a>

        </div>
