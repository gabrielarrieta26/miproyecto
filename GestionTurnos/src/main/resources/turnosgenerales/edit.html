<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
    
    <!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

    <body>

        <div class="container">

            <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->
            
            <!-- ============================================================= -->
            <!-- Inicio Zona de Ajuste -->

            <h2>Turno General</h2>
            <div>
                <form class="form-horizontal" th:object="${entity}" th:action="@{/turnosgenerales}" method="post">
                    <input type="hidden" th:field="*{id}"/>

                    <div class="form-group">
                        <div class="col-sm-2 control-label">
                            <label align="right" >Día</label>
                        </div>
                        <div class="col-sm-10">
                            <select  class="form-control" th:field="${entity.dia}" >
                                <option th:each="d : ${diashorarios.dias}"
                                        th:value="${d.id}"
                                        th:text="${d.descrip}"/>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="col-sm-2 control-label">
                            <label align="right" >Horario</label>
                        </div>
                        <div class="col-sm-10">
                            <select  class="form-control" th:field="${entity.horario}" >
                                <option th:each="h : ${diashorarios.horarios}"
                                        th:value="${h.id}"
                                        th:text="${h.descrip}"/>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-2 control-label"></label>
                        <div class="col-sm-10">
                            <input type="checkbox" th:field="*{estado}"/>
                            Estado Activo
                        </div>
                    </div>

                    <div class="row">
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a class="btn btn-default" th:href="${'/gestionturnos/turnosgenerales'}">Cancelar</a>
                    </div>
                    <h5 style="color:red;" th:text="${message}"></h5>
                </form>
            </div>
            
            <!-- Fin Zona de Ajuste -->

        </div>

    </body>
</html>
