<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <br/>

    <h2>Turnos Generales</h2>

    <form class="form-horizontal" th:action="@{/turnosgenerales/save}" th:object="${diashorarios}" method="post">

        <div class="form-group row">
            <label class="col-sm-2 col-form-label font-weight-bold">Día:</label>
            <div class="col-sm-4">
                <select class="form-control" name="diaId" id="cmbDia" required
                        onchange="window.location.href = this.options[this.selectedIndex].getAttribute('data-url')">
                    <option th:each="d : ${diashorarios.dias}"
                            th:value="${d.id}"
                            th:text="${d.descrip}"
                            th:attr="data-url=@{/turnosgenerales(diaId=${d.id})}"
                            th:selected="${diaSeleccionadoId != null and diaSeleccionadoId.equals(d.id)}">
                    </option>
                </select>
            </div>
            <div class="col-sm-2">
                <button type="submit" class="btn btn-success">Guardar</button>
            </div>
        </div>

        <br/>

        <div class="form-group row">
            <label class="col-sm-2 col-form-label font-weight-bold">Horarios:</label>
            <div class="col-sm-6">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="thead-light">
                        <tr>
                            <th width="10%" class="text-center">Seleccionar</th>
                            <th>Hora</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="horario, stat : *{horarios}">
                            <input type="hidden" th:field="*{horarios[__${stat.index}__].id}" />

                            <td class="text-center">
                                <input type="checkbox"
                                       th:name="|horarios[${stat.index}].sel|"
                                       th:checked="${horario.sel}"
                                       value="true"/>
                                <input type="hidden" th:name="|_horarios[${stat.index}].sel|" value="on"/>
                            </td>

                            <td th:text="${horario.descrip}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <h5 style="color:red;" th:text="${message}"></h5>

    </form>

</div>

</body>
</html>
